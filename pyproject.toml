[project]
name = "magic-bot"
version = "0.1.0"
description = "Local tools for working with Magic: The Gathering rules"
requires-python = ">=3.12"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
pdf-to-text = "backend.ingestion.pdf_to_text:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
